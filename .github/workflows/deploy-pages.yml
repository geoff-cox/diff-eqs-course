# .github/workflows/deploy-pages.yml   (v2)
#
# Builds the PreTeXt site and publishes it to GitHub Pages so the
# instructor can review rendered HTML from a phone.
#
# v2 change: instead of a hardcoded TARGETS list, this uses the PreTeXt
# CLI's own deploy machinery — `pretext build --deploys` builds every
# target marked for deployment in project.ptx, and
# `pretext deploy --stage-only` assembles the site in output/stage
# exactly as the project defines it. No target-name drift possible;
# Task D1 is now just "confirm the deploy targets in project.ptx".
#
# Triggers:
#   * push to main         -> deploys the merged state (the "real" site)
#   * PR labeled `preview` -> deploys THAT BRANCH's build (one Pages site
#                             per repo, so a preview temporarily replaces
#                             the main deployment; restored on merge or by
#                             re-running on main; fine for a solo repo)
#   * workflow_dispatch    -> manual run on any branch
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# NOTE: this replaces BOTH auto-generated PreTeXt workflows
# (pretext-deploy.yml pushed a gh-pages branch — a different Pages source
# mode — and pretext-cli.yml duplicated the build). Delete those two.

name: Deploy PreTeXt site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    # Full PreTeXt image: includes TeX, so <latex-image> assets and any
    # print/PDF deploy targets build without extra setup.
    container: oscarlevin/pretext-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PreTeXt CLI (respect repo pin if present)
        run: |
          git config --global --add safe.directory "$(pwd)"
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --break-system-packages
          else
            pip install pretext --break-system-packages
          fi
          pretext --version

      - name: Build deploy targets
        run: |
          # Do NOT pipe pretext straight into grep: a shell pipeline exits with
          # the status of the LAST command, so `pretext | grep` reports grep's
          # status and a failed build looks green.  (The old `|| true` on the
          # end discarded the status a second time.)  That is exactly how a
          # build that died on the first stylesheet still got deployed — as an
          # empty stu/ directory, so every content URL on the site 404'd.
          # Run the build on its own, keep its status, filter for display only.
          pretext build --deploys > build.log 2>&1 || build_failed=1
          grep -v 'asset directories' build.log || true
          if [ -n "${build_failed:-}" ]; then
            echo "::error::pretext build --deploys failed — see the log above"
            exit 1
          fi

      - name: Stage site
        run: |
          pretext deploy --stage-only
          # `pretext deploy --stage-only` stages into output/stage by default.
          test -d output/stage || { echo "::error::pretext deploy produced no output/stage — check project.ptx"; exit 1; }
          # A staged target directory is created even when the build wrote
          # nothing into it, so "output/stage exists" is not enough: check that
          # some target actually produced a page.  -mindepth 2 skips the
          # landing page copied in from site/, which is present regardless.
          # Target-name agnostic, so this stays correct as deploy-dirs change.
          if [ -z "$(find output/stage -mindepth 2 -name index.html -print -quit)" ]; then
            echo "::error::no target index.html under output/stage — the build produced nothing to deploy"
            exit 1
          fi
          # Stamp the build so previews are unambiguous when reviewing.
          echo "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA} on $(date -u '+%Y-%m-%d %H:%M UTC')" > output/stage/build-info.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/stage

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
